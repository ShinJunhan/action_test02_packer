# ~/github_action/test02_packer/.github/workflows/setup_infra.yml

name: 'Setup infra'

on:
  push:
    branches:
      - master
    paths:
      - "terraform/**"
  workflow_dispatch: # 콜론(:)을 추가하여 섹션을 정의합니다.

# jobs는 줄 맨 앞(Column 1)에서 시작해야 합니다.
jobs:
  terraform-run:
    runs-on: ubuntu-latest
    steps:
      # checkout 
      - name: Checkout Repository
        uses: actions/checkout@v4

      # aws 인증정보 제공 
      - name: Aws Configure 
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2   

      # 테라폼 설치 
      - name: Setup Terraform 
        uses: hashicorp/setup-terraform@v3 # 최신 안정 버전 권장

       # ./terraform 안에 있는 terraform 자원을 init, apply
      - name: Terraform Init & Apply 
        run: |
          terraform init
          terraform apply --auto-approve
        working-directory: ./terraform
