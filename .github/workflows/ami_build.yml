# ~/github_action/test02_packer/.github/workflows/ami_build.yml

name: "Packer AMI 만들기"
on:
  push:
    branches:
      - master  # master 브랜치에 push 하면서
    paths:
      - "packer/**"   # packer/ 하위 경로에 변화가 있을 때 동작
  workflow_dispatch:  # 원할 때 버튼으로 deploy 할 수 있는 옵션

jobs:
  packer_build: # <--  job 의 이름은 마음대로 지을 수 있다.
    # ubuntu 를 잠시 빌려서 작업을 하겠다
    runs-on: ubuntu-latest
    name: "Build AMI with packer & ansible"
    steps:
      - name: Checkout Repository   # github 저장소로부터 소스코드 가져오기
        uses: actions/checkout@v4

      - name: Setup Packer     # ubuntu 에 packer 설치
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"

      # 인증 정보를 환경 변수에 넣을 수도 있지만 혹시 중간에 에러가 났을 때 인증키가 로그에 노출될 수 있다
      # 아래와 같이 설정하면 에러가 났을 때, 터미널 창에 인증키 정보가 들어나지 않는다
      - name: Aws Configuer    # aws 인증 정보 제공
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Packer Init & Build     # 패커 초기화 & 이미지 빌드
        run: |
          packer init .
          packer build .
        # ./packer/xxx.pkr.hcl 파일을 이용해서 init, build 작업 수행
        working-directory: ./packer

      - name: Setup Terraform         # 테라폼 설치
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init & Apply  # ./terraform 안에 있는 terraform 자원을 init & apply
        run: |
          terraform init
          terraform apply --auto-approve
        # ./terraform 폴더 안에서 위의 명령어가 실행이 된다.
        working-directory: ./terraform